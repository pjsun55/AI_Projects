name: iOS PWA Lab tests and Pages
on:
  push:
    branches: [main]
    paths: ['ios-pwa-lab/public/**', 'ios-pwa-lab/tests/**', 'ios-pwa-lab/tools/**', 'ios-pwa-lab/package*.json', 'ios-pwa-lab/playwright.config.js', '.github/workflows/ios-pwa-lab.yml']
  pull_request:
    paths: ['ios-pwa-lab/public/**', 'ios-pwa-lab/tests/**', 'ios-pwa-lab/tools/**', 'ios-pwa-lab/package*.json', 'ios-pwa-lab/playwright.config.js', '.github/workflows/ios-pwa-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-pwa-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios-pwa-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: ios-pwa-lab-tests
          path: |
            ios-pwa-lab/playwright-report/
            ios-pwa-lab/test-results/
          retention-days: 7
      - run: npm run package:site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ios-pwa-lab/site-dist
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
